[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "karakeep-opds"
version = "0.1.0"
description = "Expose Karakeep bookmarks as OPDS 1.2 and OPDS 2 feeds."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "karakeep-opds contributors" }]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "ebooklib>=0.18",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "markdown>=3.7.0",
  "markdownify>=0.14.0",
  "pydantic-settings>=2.6.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/karakeep-app/karakeep"

[tool.hatch.build.targets.wheel]
packages = ["src/karakeep_opds"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
